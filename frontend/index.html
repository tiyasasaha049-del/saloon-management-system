<!doctype html>
<html lang="en" data-theme="light" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D4AF37'><path d='M6 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3H6zm6 2a1 1 0 0 1 1 1v4.586l1.293-1.293a1 1 0 1 1 1.414 1.414L13.414 13l2.293 2.293a1 1 0 0 1-1.414 1.414L13 15.414V20a1 1 0 1 1-2 0v-4.586l-2.293 2.293a1 1 0 0 1-1.414-1.414L9.586 13 7.293 10.707a1 1 0 0 1 1.414-1.414L10 10.586V6a1 1 0 0 1 1-1z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMINA LUXE | Luxury Salon & Spa Enterprise Suite</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('lumina_theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('theme-dark');
            document.documentElement.classList.remove('theme-light');
          } else {
            document.documentElement.classList.add('theme-light');
            document.documentElement.classList.remove('theme-dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body data-theme="light">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
